<style>
:root{--bg:#0b1630;--panel:#14244a;--panel2:#1c3266;--line:#2a4180;--tx:#eef3ff;--mut:#9fb0d6;--blue:#3a86ff;--gold:#ffd166;--ok:#06d6a0;--bad:#ef476f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{min-height:100vh;touch-action:manipulation;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#app{max-width:640px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:38px;margin:22px 0 2px;letter-spacing:-.5px}
h2{font-size:21px;margin:0 0 10px}h3{margin:18px 0 8px;font-size:17px}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--panel);border-radius:18px;padding:16px;margin-bottom:14px}
.btn{display:inline-block;border:0;border-radius:14px;padding:13px 16px;font:inherit;font-size:16px;font-weight:700;color:#fff;background:var(--blue);cursor:pointer}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.4}
.btn.sec{background:var(--panel2)}.btn.ok{background:var(--ok);color:#06251c}.btn.gh{background:transparent;border:1px solid var(--line)}
.btn.big{width:100%;padding:16px;font-size:18px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
label{display:block;font-weight:700;margin:12px 0 6px}
input.in{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:13px;font:inherit;font-size:18px}
.hint{color:var(--mut);font-size:14px;line-height:1.45}
.center{text-align:center}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}.top .tt{flex:1;font-weight:800;font-size:18px}
.kode{font-size:clamp(48px,16vw,84px);font-weight:900;letter-spacing:.16em;text-align:center;padding:6px 0;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--panel);font-weight:700}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.chip.mig{outline:2px solid var(--gold)}.chip.off{opacity:.4}
.spilgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sk{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.sk .e{font-size:30px}.sk b{display:block;font-size:16px;margin-top:4px}.sk small{display:block;color:var(--mut);font-size:12.5px;margin-top:4px;line-height:1.35}
.sk[disabled]{opacity:.45}
.sk .spm{display:inline-block;margin:6px 6px 0 0;padding:3px 9px;border-radius:999px;background:var(--panel2);color:#cfe0ff;font-size:12px;font-weight:800}.sk .spm.advar{background:rgba(255,209,102,.18);color:var(--gold)}
.banner{font-weight:900;font-size:19px;text-align:center;padding:12px;border-radius:16px;background:var(--panel);color:var(--mut);margin:6px 0 12px}
.banner.min{background:var(--ok);color:#04251b;animation:glow 1.6s infinite}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(6,214,160,.55)}70%{box-shadow:0 0 0 12px rgba(6,214,160,0)}100%{box-shadow:0 0 0 0 rgba(6,214,160,0)}}
.stilling{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.hostbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--panel2);padding:10px 16px;border-radius:12px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center;font-weight:700}
.hidden{display:none!important}
canvas{display:block;max-width:100%;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px;justify-content:center;margin-top:10px}
.pad button{border:0;border-radius:14px;background:var(--panel2);color:#fff;font-size:24px;font-weight:900}
.overlay{position:fixed;inset:0;background:rgba(5,10,25,.82);display:grid;place-items:center;z-index:40;padding:16px}
.overlay .card{max-width:420px;width:100%;text-align:center}
.sprogvalg{display:flex;justify-content:flex-end;gap:6px;margin-top:4px}
.sprogvalg button{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.sprogvalg button.on{background:var(--panel2);color:var(--tx);border-color:var(--blue)}
.bundlinks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.bundlinks .btn{font-size:14px;padding:10px 14px;text-decoration:none}
.overlay .card.fb{text-align:left}
textarea.in{width:100%;min-height:130px;resize:vertical;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px;font:inherit;font-size:16px;user-select:text;-webkit-user-select:text}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="hidden"></div>
<script src="app.js?v=11"></script>
<script src="sprog.js?v=8"></script>
<script src="spil-hangman.js?v=5"></script>
<script src="spil-tegn.js?v=5"></script>
<script src="spil-ordhjul.js?v=5"></script>
<script src="spil-slagskib.js?v=5"></script>
<script src="spil-yatzy.js?v=5"></script>
<script src="spil-ludo.js?v=5"></script>
<script src="spil-braet.js?v=7"></script>
<script src="spil-kort.js?v=5"></script>
<script src="spil-knappenaal.js?v=5"></script>
<script src="spil-realtid.js?v=5"></script>
<script src="spil-arkade.js?v=5"></script>
<script src="spil-kanon.js?v=10"></script>
<script>BS.start();</script>
</body>
